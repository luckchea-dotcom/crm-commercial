<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Gestion des Commerciaux (Google Drive)</title>
  <style>
    body {background:#111;color:#f90;font-family:sans-serif;padding:20px;}
    h1{color:#f90;}
    table{width:100%;border-collapse:collapse;margin-top:20px;}
    th,td{border:1px solid #333;padding:8px;text-align:left;color:#fff;}
    button{background:#f90;color:#000;border:none;padding:5px 10px;cursor:pointer;}
    input{padding:5px;margin-right:5px;}
  </style>
  <script src="https://apis.google.com/js/api.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
<h1>Gestion des Commerciaux (Google Drive)</h1>

<button onclick="handleAuthClick()">🔑 Connexion Google</button>
<button onclick="handleSignoutClick()">🔒 Déconnexion</button>
<br><br>
<input type="text" id="prenom" placeholder="Prénom">
<input type="text" id="nom" placeholder="Nom">
<button onclick="addCommercial()">Ajouter</button>

<table id="table">
  <thead>
    <tr><th>Prénom</th><th>Nom</th><th>Action</th></tr>
  </thead>
  <tbody></tbody>
</table>

<script>
const CLIENT_ID = '621178522319-1t1sk39qofb1gs9n1j3iq5fivsdlkiis.apps.googleusercontent.com';
const SCOPES = 'https://www.googleapis.com/auth/drive.file';
let fileId = null;
let commerciaux = [];

gapi.load('client', async () => {
  await gapi.client.init({
    discoveryDocs: ['https://www.googleapis.com/discovery/v1/apis/drive/v3/rest'],
  });
});

function handleAuthClick() {
  const tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: CLIENT_ID,
    scope: SCOPES,
    callback: async (resp) => {
      if (resp.error) throw(resp);
      await loadOrCreateFile();
    },
  });
  tokenClient.requestAccessToken({prompt: ''});
}

function handleSignoutClick() {
  gapi.client.setToken('');
  fileId = null;
  commerciaux = [];
  renderTable();
  alert('Déconnecté');
}

async function loadOrCreateFile() {
  let res = await gapi.client.drive.files.list({
    q: "name='commerciaux.json' and trashed=false",
    fields: 'files(id,name)'
  });
  if (res.result.files.length>0){
    fileId = res.result.files[0].id;
    await readFile();
  } else {
    let createRes = await gapi.client.drive.files.create({
      resource: {name:'commerciaux.json',mimeType:'application/json'},
      fields:'id'
    });
    fileId = createRes.result.id;
    commerciaux=[];
    await updateFile();
  }
}

async function readFile() {
  let res = await gapi.client.drive.files.get({
    fileId: fileId,
    alt:'media'
  });
  try {
    commerciaux = JSON.parse(res.body);
  } catch(e){ commerciaux=[]; }
  renderTable();
}

async function updateFile() {
  const blob = new Blob([JSON.stringify(commerciaux)], {type:'application/json'});
  const form = new FormData();
  form.append('metadata', new Blob([JSON.stringify({name:'commerciaux.json'})],{type:'application/json'}));
  form.append('file', blob);

  await fetch('https://www.googleapis.com/upload/drive/v3/files/' + fileId + '?uploadType=multipart', {
    method: 'PATCH',
    headers: {'Authorization': 'Bearer ' + gapi.auth.getToken().access_token},
    body: form
  });
  renderTable();
}

function renderTable(){
  const tbody = document.querySelector('#table tbody');
  tbody.innerHTML='';
  commerciaux.forEach((c,i)=>{
    let tr=document.createElement('tr');
    tr.innerHTML=`<td>${c.prenom}</td><td>${c.nom}</td><td><button onclick="deleteCommercial(${i})">Supprimer</button></td>`;
    tbody.appendChild(tr);
  });
}

function addCommercial(){
  let prenom=document.getElementById('prenom').value.trim();
  let nom=document.getElementById('nom').value.trim();
  if(!prenom || !nom) return;
  commerciaux.push({prenom,nom});
  updateFile();
  document.getElementById('prenom').value='';
  document.getElementById('nom').value='';
}

function deleteCommercial(index){
  commerciaux.splice(index,1);
  updateFile();
}
</script>
</body>
</html>
