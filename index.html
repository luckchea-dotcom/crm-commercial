<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Gestion des Commerciaux (Google Drive)</title>
  <style>
    body { font-family: Arial, sans-serif; background: #1e1e1e; color: #f0f0f0; padding: 20px; }
    h1 { color: orange; }
    .form { margin-bottom: 20px; }
    input { padding: 5px; margin: 5px; }
    button { padding: 5px 10px; margin: 5px; background: orange; border: none; cursor: pointer; }
    button:hover { background: #ffcc00; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { border: 1px solid #444; padding: 8px; text-align: center; }
    th { background-color: #333; color: orange; }
    tr:nth-child(even) { background-color: #2a2a2a; }
    .navbar { margin-bottom: 20px; }
  </style>
</head>
<body>
  <h1>Logiciel – Gestion des Commerciaux (Google Drive)</h1>

  <div class="navbar">
    <button onclick="handleSignIn()">🔑 Connexion Google</button>
    <button onclick="handleSignOut()">🚪 Déconnexion</button>
  </div>

  <div class="form">
    <input type="text" id="prenom" placeholder="Prénom">
    <input type="text" id="nom" placeholder="Nom">
    <button onclick="ajouterCommercial()">Ajouter</button>
  </div>

  <table>
    <thead>
      <tr><th>Prénom</th><th>Nom</th><th>Action</th></tr>
    </thead>
    <tbody id="listeCommerciaux"></tbody>
  </table>

  <script src="https://apis.google.com/js/api.js"></script>
  <script>
    const CLIENT_ID = "224874638085-t3ohlqs7ucrhuuk94fk2q1265muvu1uh.apps.googleusercontent.com";
    const API_KEY = "AIzaSyDz7ln87HRF0qBy49TWXuYWLV1GyQRr4kA";

    const DISCOVERY_DOCS = ["https://www.googleapis.com/discovery/v1/apis/drive/v3/rest"];
    const SCOPES = "https://www.googleapis.com/auth/drive.file";

    let commerciaux = [];
    let FILE_ID = null;

    function afficherCommerciaux() {
      const tbody = document.getElementById("listeCommerciaux");
      tbody.innerHTML = "";
      commerciaux.forEach((c, i) => {
        const row = `<tr>
          <td>${c.prenom}</td>
          <td>${c.nom}</td>
          <td><button onclick="supprimerCommercial(${i})">Supprimer</button></td>
        </tr>`;
        tbody.innerHTML += row;
      });
    }

    function initClient() {
      gapi.client.init({
        apiKey: API_KEY,
        clientId: CLIENT_ID,
        discoveryDocs: DISCOVERY_DOCS,
        scope: SCOPES
      }).then(() => {
        const auth = gapi.auth2.getAuthInstance();
        if (auth.isSignedIn.get()) {
          chargerFichier();
        }
      });
    }

    function handleSignIn() {
      gapi.auth2.getAuthInstance().signIn().then(chargerFichier);
    }

    function handleSignOut() {
      gapi.auth2.getAuthInstance().signOut();
    }

    gapi.load("client:auth2", initClient);

    function chargerFichier() {
      gapi.client.drive.files.list({
        q: "name='commerciaux.json' and trashed=false",
        fields: "files(id, name)"
      }).then(res => {
        if (res.result.files && res.result.files.length > 0) {
          FILE_ID = res.result.files[0].id;
          lireFichier();
        } else {
          creerFichier();
        }
      });
    }

    function creerFichier() {
      console.log("➡️ Création du fichier commerciaux.json...");
      const fileMetadata = { name: "commerciaux.json", mimeType: "application/json" };
      const fileContent = JSON.stringify({ commerciaux: [] });
      const boundary = "-------314159265358979323846";
      const delimiter = "\r\n--" + boundary + "\r\n";
      const closeDelimiter = "\r\n--" + boundary + "--";

      const body =
        delimiter +
        "Content-Type: application/json\r\n\r\n" +
        JSON.stringify(fileMetadata) +
        delimiter +
        "Content-Type: application/json\r\n\r\n" +
        fileContent +
        closeDelimiter;

      gapi.client.request({
        path: "/upload/drive/v3/files?uploadType=multipart",
        method: "POST",
        body: body,
        headers: { "Content-Type": "multipart/related; boundary=" + boundary }
      }).then((response) => {
        FILE_ID = response.result.id;
        lireFichier();
      });
    }

    function lireFichier() {
      console.log("➡️ Lecture du fichier commerciaux.json avec ID:", FILE_ID);
      gapi.client.drive.files.get({
        fileId: FILE_ID,
        alt: "media"
      }).then(res => {
        commerciaux = res.result.commerciaux || [];
        afficherCommerciaux();
      });
    }

    function sauvegarderFichier() {
      console.log("➡️ Sauvegarde des commerciaux:", commerciaux);
      const fileContent = JSON.stringify({ commerciaux: commerciaux });
      const boundary = "-------314159265358979323846";
      const delimiter = "\r\n--" + boundary + "\r\n";
      const closeDelimiter = "\r\n--" + boundary + "--";

      const body =
        delimiter +
        "Content-Type: application/json\r\n\r\n" +
        JSON.stringify({ name: "commerciaux.json" }) +
        delimiter +
        "Content-Type: application/json\r\n\r\n" +
        fileContent +
        closeDelimiter;

      gapi.client.request({
        path: "/upload/drive/v3/files/" + FILE_ID + "?uploadType=multipart",
        method: "PATCH",
        body: body,
        headers: { "Content-Type": "multipart/related; boundary=" + boundary }
      }).then(() => {
        alert("✅ Sauvegardé sur Google Drive !");
      });
    }

    function ajouterCommercial() {
      const prenom = document.getElementById("prenom").value.trim();
      const nom = document.getElementById("nom").value.trim();
      if (prenom && nom) {
        commerciaux.push({ prenom, nom });
        document.getElementById("prenom").value = "";
        document.getElementById("nom").value = "";
        afficherCommerciaux();
        sauvegarderFichier();
      } else {
        alert("Veuillez entrer un prénom et un nom.");
      }
    }

    function supprimerCommercial(index) {
      commerciaux.splice(index, 1);
      afficherCommerciaux();
      sauvegarderFichier();
    }
  </script>
</body>
</html>
